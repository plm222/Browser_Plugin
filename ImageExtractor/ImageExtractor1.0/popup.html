<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    button { 
      width: 100%; padding: 10px; background-color: #0078D7; 
      color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    button:hover { background-color: #005A9E; }
    #result { 
      margin-top: 15px; max-height: 300px; overflow-y: auto; 
      font-size: 12px; word-break: break-all; color: #333;
    }
    .url-item { margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
  </style>
</head>
<body>
  <button id="extractBtn">🚀 提取当前网页图片</button>
  <div id="result">点击上方按钮开始提取...</div>
  
  <script src="popup.js"></script>
</body>
</html>
